server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same idea as the Vite proxy in development: the browser calls /api on this same server,
    # and nginx forwards it to the backend container. "backend" is the service name in compose.yaml.
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # Everything else is the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
