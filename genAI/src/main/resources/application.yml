spring:
  application:
    name: tasks
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasks}
    username: ${DB_USERNAME:tasks}
    password: ${DB_PASSWORD:tasks}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

app:
  # Business time zone: decides what "today" is for the due-date rule. Any java.time.ZoneId, e.g. America/Guayaquil.
  time-zone: ${APP_TIME_ZONE:UTC}
  jwt:
    # No default on purpose: the application refuses to start without a signing secret.
    secret: ${JWT_SECRET}
    issuer: genai-tasks
    ttl: PT1H
