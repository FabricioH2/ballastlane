# Profile "demo": everything in application.yaml + the demo data (user/user and Onix).
# Docker Compose turns it on with SPRING_PROFILES_ACTIVE=demo.
# Locally: .\gradlew.bat bootTestRun --args='--spring.profiles.active=demo'
spring:
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/seed
