spring:
  application:
    name: bla-excercise
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  cache:
    cache-names:
      - pokeapi-pokemon-pages
      - pokeapi-pokemon
      - pokeapi-species
      - pokeapi-evolution-chains
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=24h

app:
  pagination:
    max-page-size: 100
  pokeapi:
    base-url: https://pokeapi.co/api/v2
    connect-timeout: 3s
    read-timeout: 5s
